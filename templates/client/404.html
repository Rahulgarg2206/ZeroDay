<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 - Page Not Found</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-size: 5rem;
            margin-bottom: 1rem;
            color: #00ff88;
        }
        p {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        a {
            color: #00ffff;
            text-decoration: none;
            font-size: 1.2rem;
            border: 1px solid #00ff88;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        a:hover {
            background-color: #00ff88;
            color: #0a0a0a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p>Oops! The page you are looking for does not exist.</p>
        <p><a href="/">Return to Home</a></p>
    </div>
</body>
</html>
