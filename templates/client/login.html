<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Zero Day Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        *::-webkit-scrollbar {
            display: none;
        }

        body {
            background-color: #0a0a0a;
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            padding: 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.1);
            animation: fadeIn 0.5s ease-out;
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 2rem;
            background: linear-gradient(45deg, #00ff88, #00ffff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: #b3b3cc;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-input {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(0, 255, 136, 0.05);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 5px;
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }

        .submit-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(45deg, #00ff88, #00ffff);
            border: none;
            border-radius: 5px;
            color: #0a0a0a;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 1rem;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.3);
        }

        .links {
            display: flex;
            justify-content: space-between;
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }

        .links a {
            color: #00ffff;
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
        }

        .links a::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 1px;
            bottom: -2px;
            left: 0;
            background: linear-gradient(90deg, #00ff88, #00ffff);
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.3s ease;
        }

        .links a:hover {
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .links a:hover::after {
            transform: scaleX(1);
            transform-origin: left;
        }

        .register-link {
            text-align: center;
            margin-top: 2rem;
            color: #b3b3cc;
        }

        .register-link a {
            color: #00ffff;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .register-link a:hover {
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 1.5rem;
            }

            .title {
                font-size: 2rem;
            }

            .links {
                flex-direction: column;
                align-items: center;
                gap: 1rem;
            }
        }

        .notifications-dropdown {
            position: relative;
            margin-top: auto;
            padding: 1rem;
        }

        .notification-badge {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: #ff0066;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        @media (max-width: 768px) {
            .notification-badge {
                right: 0.2rem;
                top: 0.2rem;
            }
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 1rem 2rem;
            border-radius: 5px;
            font-family: 'Share Tech Mono', monospace;
            animation: slideIn 0.3s ease-out, fadeOut 0.3s ease-out 1.7s;
            z-index: 1000;
        }

        .error-toast {
            background: rgba(255, 0, 102, 0.9);
            color: #fff;
        }

        #successToast {
            background: rgba(0, 255, 136, 0.9);
            color: #000;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
    </style>
</head>
<body>
    {% if registration_success %}
    <div class="toast" id="successToast">Registration successful!</div>
    {% endif %}

    {% if error %}
    <div class="toast error-toast" id="errorToast">{{ error }}</div>
    {% endif %}

    <div class="main-content">
        <div class="login-card">
            <h1 class="title">Welcome Back</h1>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" name="email" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-input" required>
                </div>

                <button type="submit" class="submit-btn">Login</button>
            </form>

            <div class="links">
                <a href="/forgot-password">Forgot Password?</a>
            </div>

            <div class="register-link">
                New to Zero Day Arena? <a href="/register">Join Now</a>
            </div>
        </div>
    </div>

    <script>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            const flashMessages = {{ messages|tojson }};
            flashMessages.forEach(msg => {
                toastr.error(msg);
            });
          {% endif %}
        {% endwith %}

        async function handleLogin(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showToast('Please fill in all fields', true);
                return;
            }

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        'email': email,
                        'password': password
                    })
                });

                const data = await response.json();
                
                if (data.success) {
                    window.location.href = data.redirect;
                } else {
                    showToast(data.message, true);
                }
            } catch (error) {
                showToast('An error occurred. Please try again.', true);
            }
        }

        function showToast(message, isError = false) {
            // Remove any existing toasts
            const existingToasts = document.querySelectorAll('.toast');
            existingToasts.forEach(toast => toast.remove());

            // Create new toast
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? 'error-toast' : ''}`;
            toast.textContent = message;
            document.body.appendChild(toast);

            // Remove toast after 2 seconds
            setTimeout(() => {
                toast.remove();
            }, 2000);
        }

        // Handle registration success toast
        const successToast = document.getElementById('successToast');
        if (successToast) {
            setTimeout(() => {
                successToast.remove();
            }, 2000);
        }
    </script>
</body>
</html>
